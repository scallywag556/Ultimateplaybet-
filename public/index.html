<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UltimatePlayBet</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #05070a;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

button {
  font-family: inherit;
}

header {
  height: 72px;
  background: #080b0f;
  border-bottom: 1px solid #242b34;
  display: flex;
  align-items: center;
  padding: 0 18px;
  position: sticky;
  top: 0;
  z-index: 50;
}

.logo {
  font-size: 25px;
  font-weight: 900;
  flex: 1;
}

.logo span {
  color: #ed323b;
}

.balance {
  text-align: right;
}

.balance small {
  display: block;
  color: #8e97a3;
  font-size: 11px;
  letter-spacing: 1px;
}

.balance strong {
  font-size: 20px;
}

.notice {
  padding: 9px;
  text-align: center;
  background: #10151b;
  color: #9da6b1;
  font-size: 12px;
  border-bottom: 1px solid #252d36;
}

.notice strong {
  color: #ff424b;
}

.main-layout {
  max-width: 1500px;
  margin: auto;
  display: grid;
  grid-template-columns: 190px 1fr 320px;
}

.sidebar {
  min-height: calc(100vh - 100px);
  border-right: 1px solid #202730;
  padding: 15px 10px;
}

.sidebar h4 {
  color: #ef343d;
  margin: 10px;
}

.sport-button {
  width: 100%;
  border: none;
  background: transparent;
  color: #c8ced6;
  text-align: left;
  padding: 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
}

.sport-button.active,
.sport-button:hover {
  background: #171d25;
  color: white;
}

.content {
  padding: 16px;
}

.hero {
  background:
    linear-gradient(90deg, rgba(14,18,24,.97), rgba(80,15,20,.82));
  border: 1px solid #27303b;
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 15px;
}

.hero h1 {
  margin: 0 0 8px;
  font-size: 29px;
}

.hero p {
  margin: 0;
  color: #b3bbc5;
}

.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  margin-bottom: 14px;
}

.tab {
  border: 1px solid #2b333d;
  background: #11161d;
  color: #c4cbd3;
  padding: 10px 15px;
  border-radius: 7px;
  cursor: pointer;
}

.tab.active {
  background: #ed323b;
  color: white;
  border-color: #ed323b;
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.section-header h2 {
  font-size: 18px;
}

.refresh {
  background: #151b23;
  border: 1px solid #2c3540;
  color: white;
  padding: 8px 11px;
  border-radius: 7px;
  cursor: pointer;
}

.game {
  background: #0d1116;
  border: 1px solid #242c35;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 11px;
}

.game-header {
  display: flex;
  justify-content: space-between;
  padding: 10px 12px;
  border-bottom: 1px solid #202731;
  color: #929ba7;
  font-size: 12px;
}

.live {
  color: #ff4049;
  font-weight: bold;
}

.teams {
  padding: 12px;
}

.team {
  display: flex;
  justify-content: space-between;
  margin: 6px 0;
  font-size: 16px;
}

.score {
  color: #ffc132;
  font-weight: bold;
}

.market-labels,
.market-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

.market-labels {
  padding: 0 12px 5px;
  color: #7e8995;
  text-align: center;
  font-size: 11px;
}

.market-row {
  padding: 0 12px 10px;
}

.odd {
  border: 1px solid #2a3540;
  background: #18212a;
  color: white;
  padding: 11px 4px;
  border-radius: 6px;
  cursor: pointer;
}

.odd:hover {
  background: #273544;
}

.odd.selected {
  background: #ed323b;
  border-color: #ed323b;
}

.betslip {
  min-height: calc(100vh - 100px);
  border-left: 1px solid #202730;
  background: #080b0f;
  padding: 16px 12px;
}

.betslip h2 {
  margin-top: 0;
}

.empty {
  color: #7f8995;
  text-align: center;
  padding: 28px 10px;
}

.pick {
  background: #11171e;
  border: 1px solid #29323d;
  border-radius: 8px;
  padding: 11px;
  margin-bottom: 9px;
}

.pick-top {
  display: flex;
  justify-content: space-between;
}

.pick small {
  color: #8f99a5;
}

.remove {
  border: none;
  background: transparent;
  color: #bbb;
  cursor: pointer;
}

.wager {
  width: 100%;
  background: #11171e;
  border: 1px solid #303a46;
  color: white;
  padding: 13px;
  border-radius: 7px;
  font-size: 17px;
}

.summary {
  display: flex;
  justify-content: space-between;
  margin: 13px 0;
}

.place {
  width: 100%;
  border: none;
  background: #ed323b;
  color: white;
  padding: 15px;
  border-radius: 7px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

.place:disabled {
  opacity: .4;
}

.history {
  border-top: 1px solid #28313b;
  padding-top: 15px;
  margin-top: 20px;
}

.history-item {
  background: #11171e;
  padding: 10px;
  border-radius: 7px;
  margin-bottom: 7px;
  font-size: 13px;
}

.loading {
  text-align: center;
  color: #8b95a1;
  padding: 40px;
}

.error {
  background: #32151a;
  border: 1px solid #713039;
  color: #ffb1b5;
  padding: 14px;
  border-radius: 8px;
}

@media (max-width: 950px) {
  .main-layout {
    grid-template-columns: 1fr;
  }

  .sidebar {
    display: none;
  }

  .betslip {
    border-left: none;
    border-top: 1px solid #202730;
    min-height: auto;
  }

  .content {
    padding: 11px;
  }

  .logo {
    font-size: 19px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    ULTIMATE<span>PLAYBET</span>
  </div>

  <div class="balance">
    <small>DEMO BALANCE</small>
    <strong id="balance">$800.00</strong>
  </div>
</header>

<div class="notice">
  <strong>NO CASH VALUE</strong>
  • NO DEPOSITS • NO WITHDRAWALS
</div>

<div class="main-layout">

<aside class="sidebar">

<h4>SPORTS</h4>

<button class="sport-button active" data-sport="nba">
🏀 NBA
</button>

<button class="sport-button" data-sport="mlb">
⚾ MLB
</button>

<button class="sport-button" data-sport="nfl">
🏈 NFL
</button>

<button class="sport-button" data-sport="nhl">
🏒 NHL
</button>

<button class="sport-button" data-sport="ncaaf">
🏈 College Football
</button>

<button class="sport-button" data-sport="ncaab">
🏀 College Basketball
</button>

</aside>

<main class="content">

<section class="hero">
<h1>Sportsbook</h1>
<p>
Live and upcoming games with current odds and start times.
</p>
</section>

<div class="tabs">

<button class="tab active" data-sport="nba">
NBA
</button>

<button class="tab" data-sport="mlb">
MLB
</button>

<button class="tab" data-sport="nfl">
NFL
</button>

<button class="tab" data-sport="nhl">
NHL
</button>

<button class="tab" data-sport="ncaaf">
NCAAF
</button>

<button class="tab" data-sport="ncaab">
NCAAB
</button>

</div>

<div class="section-header">

<h2 id="leagueTitle">
NBA
</h2>

<button class="refresh" onclick="loadEverything()">
↻ Refresh
</button>

</div>

<div id="games">
<div class="loading">
Loading current games and odds...
</div>
</div>

</main>

<aside class="betslip">

<h2>BET SLIP</h2>

<div id="picks">
<div class="empty">
Tap an odd to add a selection.
</div>
</div>

<input
id="wager"
class="wager"
type="number"
min="1"
placeholder="Wager amount"
oninput="updateSlip()"
>

<div class="summary">
<span>Potential Win</span>
<strong id="potentialWin">$0.00</strong>
</div>

<div class="summary">
<span>Total Return</span>
<strong id="totalReturn">$0.00</strong>
</div>

<button
id="placeButton"
class="place"
onclick="placeBet()"
disabled
>
PLACE BET
</button>

<div class="history">

<h3>MY BETS</h3>

<div id="history"></div>

</div>

</aside>

</div>

<script>

let currentSport = "nba";

let selections = [];

let scores = {};

let balance =
Number(localStorage.getItem("upb_balance"));

if (Number.isNaN(balance)) {
balance = 800;
}

let bets =
JSON.parse(localStorage.getItem("upb_bets") || "[]");

const sportNames = {
nba: "NBA",
mlb: "MLB",
nfl: "NFL",
nhl: "NHL",
ncaaf: "COLLEGE FOOTBALL",
ncaab: "COLLEGE BASKETBALL"
};

document.querySelectorAll("[data-sport]").forEach(button => {

button.addEventListener("click", () => {

currentSport = button.dataset.sport;

document
.querySelectorAll("[data-sport]")
.forEach(item =>
item.classList.remove("active")
);

document
.querySelectorAll(
`[data-sport="${currentSport}"]`
)
.forEach(item =>
item.classList.add("active")
);

document.getElementById(
"leagueTitle"
).textContent =
sportNames[currentSport];

loadEverything();

});

});

function formatOdds(number) {

if (
number === undefined ||
number === null
) return "—";

number = Number(number);

return number > 0
? `+${number}`
: `${number}`;

}

function formatTime(date) {

return new Intl.DateTimeFormat(
"en-US",
{
timeZone:
"America/New_York",
weekday: "short",
month: "short",
day: "numeric",
hour: "numeric",
minute: "2-digit",
timeZoneName: "short"
}
).format(
new Date(date)
);

}

function americanToDecimal(odd) {

odd = Number(odd);

if (odd > 0) {
return odd / 100 + 1;
}

return 100 / Math.abs(odd) + 1;

}

function findMarket(bookmaker, key) {

return bookmaker?.markets?.find(
market => market.key === key
);

}

function findOutcome(market, name) {

return market?.outcomes?.find(
outcome => outcome.name === name
);

}

async function loadEverything() {

const gamesContainer =
document.getElementById("games");

gamesContainer.innerHTML =
`<div class="loading">
Loading current games and odds...
</div>`;

try {

const [
oddsResponse,
scoresResponse
] =
await Promise.all([
fetch(`/api/odds/${currentSport}`),
fetch(`/api/scores/${currentSport}`)
]);

const oddsData =
await oddsResponse.json();

const scoresData =
await scoresResponse.json();

if (!oddsResponse.ok) {
throw new Error(
oddsData.error ||
"Could not load games."
);
}

scores = {};

if (scoresResponse.ok) {

(scoresData.scores || [])
.forEach(game => {

scores[game.id] = game;

});

}

renderGames(
oddsData.games || []
);

} catch (error) {

gamesContainer.innerHTML =
`<div class="error">
${error.message}
</div>`;

}

}

function renderGames(games) {

const container =
document.getElementById("games");

if (!games.length) {

container.innerHTML =
`<div class="empty">
No games are currently available.
</div>`;

return;

}

container.innerHTML = "";

games.forEach(game => {

const bookmaker =
game.bookmakers?.[0];

const h2h =
findMarket(
bookmaker,
"h2h"
);

const spreads =
findMarket(
bookmaker,
"spreads"
);

const totals =
findMarket(
bookmaker,
"totals"
);

const awayMoneyline =
findOutcome(
h2h,
game.away_team
);

const homeMoneyline =
findOutcome(
h2h,
game.home_team
);

const awaySpread =
findOutcome(
spreads,
game.away_team
);

const homeSpread =
findOutcome(
spreads,
game.home_team
);

const over =
findOutcome(
totals,
"Over"
);

const under =
findOutcome(
totals,
"Under"
);

const scoreData =
scores[game.id];

let awayScore = "";
let homeScore = "";
let statusText =
formatTime(
game.commence_time
);

if (scoreData) {

if (
scoreData.scores &&
scoreData.scores.length
) {

const awayScoreData =
scoreData.scores.find(
x =>
x.name ===
game.away_team
);

const homeScoreData =
scoreData.scores.find(
x =>
x.name ===
game.home_team
);

awayScore =
awayScoreData?.score || "";

homeScore =
homeScoreData?.score || "";

}

if (
scoreData.completed
) {

statusText =
"FINAL";

} else if (
new Date(
game.commence_time
) <= new Date()
) {

statusText =
"LIVE";

}

}

const gameElement =
document.createElement("div");

gameElement.className =
"game";

gameElement.innerHTML = `

<div class="game-header">

<span>
${game.sport_title}
</span>

<span class="${
statusText === "LIVE"
? "live"
: ""
}">
${statusText}
</span>

</div>

<div class="teams">

<div class="team">

<span>
${game.away_team}
</span>

<span class="score">
${awayScore}
</span>

</div>

<div class="team">

<span>
${game.home_team}
</span>

<span class="score">
${homeScore}
</span>

</div>

</div>

<div class="market-labels">

<span>SPREAD</span>

<span>MONEYLINE</span>

<span>TOTAL</span>

</div>

<div class="market-row">

${createOddButton(
game,
awaySpread,
game.away_team,
"Spread",
awaySpread
? `${
awaySpread.point > 0
? "+"
: ""
}${awaySpread.point}`
: "—"
)}

${createOddButton(
game,
awayMoneyline,
game.away_team,
"Moneyline",
"ML"
)}

${createOddButton(
game,
over,
"Over",
"Total",
over
? `O ${over.point}`
: "—"
)}

</div>

<div class="market-row">

${createOddButton(
game,
homeSpread,
game.home_team,
"Spread",
homeSpread
? `${
homeSpread.point > 0
? "+"
: ""
}${homeSpread.point}`
: "—"
)}

${createOddButton(
game,
homeMoneyline,
game.home_team,
"Moneyline",
"ML"
)}

${createOddButton(
game,
under,
"Under",
"Total",
under
? `U ${under.point}`
: "—"
)}

</div>

`;

container.appendChild(
gameElement
);

});

}

function createOddButton(
game,
outcome,
selectionName,
market,
lineLabel
) {

if (!outcome) {

return `
<button class="odd" disabled>
—
</button>
`;

}

const pick = {

id:
game.id +
"-" +
market +
"-" +
selectionName,

eventId:
game.id,

sport:
game.sport_title,

away:
game.away_team,

home:
game.home_team,

selection:
selectionName,

market,

line:
outcome.point ?? null,

odds:
outcome.price,

start:
game.commence_time

};

const encoded =
encodeURIComponent(
JSON.stringify(pick)
);

return `

<button
class="odd"
onclick="addPick('${encoded}')"
>

${lineLabel}

<br>

<strong>
${formatOdds(
outcome.price
)}
</strong>

</button>

`;

}

function addPick(encoded) {

const pick =
JSON.parse(
decodeURIComponent(encoded)
);

selections =
selections.filter(
selection =>
!(
selection.eventId ===
pick.eventId &&
selection.market ===
pick.market
)
);

selections.push(
pick
);

renderSlip();

}

function removePick(id) {

selections =
selections.filter(
pick =>
pick.id !== id
);

renderSlip();

}

function renderSlip() {

const container =
document.getElementById("picks");

if (!selections.length) {

container.innerHTML =
`<div class="empty">
Tap an odd to add a selection.
</div>`;

} else {

container.innerHTML =
selections.map(
pick => `

<div class="pick">

<div class="pick-top">

<strong>
${pick.selection}
</strong>

<button
class="remove"
onclick="removePick('${pick.id}')"
>
✕
</button>

</div>

<div>
${pick.market}

${
pick.line !== null
? `${
pick.line > 0
? "+"
: ""
}${pick.line}`
: ""
}

<strong>
${formatOdds(
pick.odds
)}
</strong>

</div>

<small>
${pick.away}
@
${pick.home}
</small>

</div>

`
).join("");

}

updateSlip();

}

function combinedOdds() {

if (!selections.length) {
return 0;
}

return selections.reduce(
(total, pick) =>
total *
americanToDecimal(
pick.odds
),
1
);

}

function updateSlip() {

const wager =
Number(
document.getElementById(
"wager"
).value || 0
);

const decimalOdds =
combinedOdds();

const totalReturn =
wager > 0 &&
decimalOdds > 0
? wager *
decimalOdds
: 0;

const win =
Math.max(
totalReturn -
wager,
0
);

document.getElementById(
"potentialWin"
).textContent =
`$${win.toFixed(2)}`;

document.getElementById(
"totalReturn"
).textContent =
`$${totalReturn.toFixed(2)}`;

document.getElementById(
"placeButton"
).disabled =
!selections.length ||
wager <= 0 ||
wager > balance;

}

function placeBet() {

const wager =
Number(
document.getElementById(
"wager"
).value
);

if (!selections.length) {

alert(
"Choose a selection first."
);

return;

}

if (
!wager ||
wager <= 0
) {

alert(
"Enter a wager amount."
);

return;

}

if (
wager > balance
) {

alert(
"Not enough demo balance."
);

return;

}

const decimalOdds =
combinedOdds();

const possibleReturn =
wager *
decimalOdds;

balance -= wager;

const bet = {

id:
Date.now(),

created:
new Date()
.toISOString(),

wager,

selections:
[...selections],

possibleReturn,

status:
"OPEN"

};

bets.unshift(
bet
);

localStorage.setItem(
"upb_bets",
JSON.stringify(bets)
);

selections = [];

document.getElementById(
"wager"
).value = "";

saveBalance();

renderSlip();

renderHistory();

alert(
"Demo bet placed."
);

}

function saveBalance() {

localStorage.setItem(
"upb_balance",
balance
);

document.getElementById(
"balance"
).textContent =
`$${balance.toFixed(2)}`;

}

function renderHistory() {

const container =
document.getElementById(
"history"
);

if (!bets.length) {

container.innerHTML =
`<div class="empty">
No bets yet.
</div>`;

return;

}

container.innerHTML =
bets.slice(0,10).map(
bet => `

<div class="history-item">

<strong>

${
bet.selections.length > 1
? `${bet.selections.length}-LEG PARLAY`
: bet.selections[0].selection
}

</strong>

<br>

Wager:
$${bet.wager.toFixed(2)}

<br>

Possible Return:
$${bet.possibleReturn.toFixed(2)}

<br>

Status:
${bet.status}

</div>

`
).join("");

}

saveBalance();

renderHistory();

renderSlip();

loadEverything();

/*
Refresh odds and scores every 60 seconds.
*/
setInterval(
loadEverything,
60000
);

</script>

</body>
</html>
